<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive"><meta name="theme-color" content="#0b1739">
  <title>지원현황 등록 | BigData Job Apply</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css?v=20261005-portal">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="service-brand" href="index.html" aria-label="입사지원 현황 홈">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-copy"><strong>빅데이터소프트웨어공학과</strong><small>입사지원 현황</small></span>
      </a>
      <a class="portal-link" href="https://portal.k-bigdata.kr/">통합 포털 ↗</a>
    </div>
  </header>
  <nav class="service-tabs" aria-label="입사지원 메뉴"><div class="container">
    <a href="index.html">지원 현황</a>
    <a class="active" href="register.html" aria-current="page">지원 등록</a>
  </div></nav>
  <main class="container register-main">
    <section id="form-card" class="section-card form-card">
      <div class="form-intro"><p class="eyebrow">오늘의 한 걸음</p><h2>지원한 채용공고를 등록해 주세요</h2><p>지원 기록이 쌓일수록 우리 모두의 도전도 커져요.</p></div>
      <form id="application-form">
        <div class="identity-card" aria-label="로그인 학생"><span>로그인 학생</span><strong id="current-student-name"></strong><small id="current-student-id"></small></div>
        <label for="company">기업명 <span>필수</span></label><input id="company" name="company" maxlength="100" required placeholder="예: ABC정보기술">
        <label for="position">지원직무 <span>필수</span></label><input id="position" name="position" maxlength="100" required placeholder="예: Java 백엔드 개발자">
        <label for="site">지원사이트 <span>필수</span></label><select id="site" name="site" required><option value="">지원사이트를 선택해 주세요</option><option>사람인</option><option>잡코리아</option><option>원티드</option><option>고용24</option><option>기업 채용사이트</option><option>기타</option></select>
        <label for="job-url">채용공고 URL <span>필수</span></label><input id="job-url" name="job_url" type="url" pattern="https?://.*" required placeholder="https:// 또는 http://로 시작">
        <label for="applied-date">지원일 <span>필수</span></label><input id="applied-date" name="applied_date" type="date" required>
        <p id="form-error" class="form-error" aria-live="polite"></p><button id="submit-button" class="button button-primary submit-button" type="submit">지원현황 등록하기</button>
      </form>
    </section>
    <section id="success-card" class="success-card" hidden><div class="success-check" aria-hidden="true">✓</div><p class="eyebrow">등록 완료</p><h2>등록되었습니다.</h2><strong id="success-name" class="success-name"></strong><p class="count-change">이번 주 <span id="before-count"></span> <b>→</b> <span id="after-count"></span></p><p id="goal-message" class="success-message"></p><a class="button button-primary" href="index.html">메인 화면으로</a></section>
  </main>
  <script type="module" src="js/register.js?v=20261005-session-1"></script>
</body>
</html>

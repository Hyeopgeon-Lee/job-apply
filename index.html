<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0b1739">
  <meta name="description" content="빅데이터소프트웨어공학과 학생들의 입사지원 현황">
  <title>BigData Job Apply</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=20261005-public-1">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="service-brand" href="index.html" aria-label="입사지원 현황 홈">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-copy"><strong>빅데이터소프트웨어공학과</strong><small>입사지원 현황</small></span>
      </a>
      <a class="portal-link" href="https://portal.k-bigdata.kr/">통합 포털 ↗</a>
    </div>
  </header>
  <nav class="service-tabs" aria-label="입사지원 메뉴"><div class="container">
    <a href="https://portal.k-bigdata.kr/recruit.html">채용공고</a>
    <a class="active" href="index.html" aria-current="page">지원 현황</a>
    <a href="register.html">지원 등록</a>
  </div></nav>
  <main class="container main-content">
    <div id="loading" class="state-card" role="status"><span class="spinner"></span><p>지원 현황을 불러오고 있어요</p></div>
    <div id="error-state" class="state-card" hidden><p id="error-message"></p><button id="retry-button" class="button button-secondary" type="button">다시 시도</button></div>
    <div id="dashboard" hidden>
      <section class="summary-card" aria-labelledby="summary-title">
        <p id="summary-title" class="eyebrow">이번 주 학과 전체 지원</p>
        <strong id="weekly-count" class="big-number">0건</strong>
        <div class="goal-line"><span>이번 주 목표</span><strong id="weekly-goal">0건</strong></div>
        <div id="goal-progress-wrap" class="progress" role="progressbar" aria-label="주간 목표 달성률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="goal-progress"></span></div>
        <p id="goal-percent" class="goal-copy"></p>
        <div class="summary-substats"><div><span>이번 달</span><strong id="monthly-count">0건</strong></div><div><span>전체 누적</span><strong id="cumulative-count">0건</strong></div></div>
      </section>
      <section class="section-card" aria-labelledby="students-title">
        <div class="section-heading"><div><p class="eyebrow">함께 만드는 기록</p><h2 id="students-title">학생별 지원 현황</h2></div><span class="period-badge">이번 주</span></div>
        <ul id="student-list" class="student-list"></ul>
      </section>
      <section aria-labelledby="recent-title">
        <div class="section-heading outside"><div><p class="eyebrow">새로운 도전</p><h2 id="recent-title">최근 입사지원</h2></div></div>
        <p id="recent-empty" class="empty-card" hidden>아직 등록된 지원 내역이 없습니다.<br>첫 지원 현황을 등록해 보세요!</p>
        <div id="recent-list" class="recent-list"></div>
      </section>
    </div>
  </main>
  <a id="register-link" class="button floating-action" href="register.html" hidden><span aria-hidden="true">＋</span> 지원현황 등록하기</a>
  <dialog id="delete-dialog" class="modal">
    <form id="delete-form" method="dialog">
      <div class="modal-icon" aria-hidden="true">!</div><h2>지원내역 삭제</h2><p>학생: <strong id="delete-student"></strong></p>
      <p>본인 확인 후 자신의 지원내역만 삭제할 수 있습니다.</p>
      <label for="delete-student-id">학번 <span>필수</span></label>
      <input id="delete-student-id" name="student_id" inputmode="numeric" autocomplete="username" required>
      <label for="delete-pin">4자리 PIN <span>필수</span></label>
      <input id="delete-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" required>
      <p id="delete-error" class="form-error" aria-live="polite"></p>
      <div class="modal-actions"><button id="delete-cancel" class="button button-ghost" type="button">취소</button><button id="delete-submit" class="button button-danger" type="submit">삭제하기</button></div>
    </form>
  </dialog>
  <script type="module" src="js/app.js?v=20261005-public-1"></script>
</body>
</html>
